<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>8-Bit 像素中国象棋 (Debug 版)</title>
    <style>
        /* ==================== 引入网络像素字体 ==================== */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        /* ==================== 全局与重置 ==================== */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* 强制所有元素直角，体现像素感 */
            border-radius: 0 !important; 
        }
        body {
            margin: 0;
            background-color: #2b2b2b;
            background-image: 
                linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222), 
                linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #fff;
            font-family: 'VT323', 'Courier New', Courier, monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ==================== 布局 ==================== */
        #board-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
            min-width: 0;
        }
        
        #panel {
            width: 35vw;
            max-width: 320px;
            background: #1a1a1a;
            border-left: 8px solid #000;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            box-shadow: -4px 0 0 #333;
            z-index: 100;
        }

        /* ==================== 棋盘像素风 ==================== */
        #board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(10, 1fr);
            background: #d4a373;
            border: 8px solid #000;
            box-shadow: 8px 8px 0 #000, inset 0 0 0 2px #8b5a2b;
            aspect-ratio: 9 / 10;
            width: 100%;
            max-width: 90vh;
            height: 100%;
            max-height: 95vw;
            position: relative;
            /* 利用背景渐变绘制粗线条网格 */
            background-image: 
                repeating-linear-gradient(to right, transparent 0, transparent calc(100% / 18 - 1px), #000 calc(100% / 18 - 1px), #000 calc(100% / 18 + 1px), transparent calc(100% / 18 + 1px), transparent calc(100% / 9)),
                repeating-linear-gradient(to bottom, transparent 0, transparent calc(100% / 20 - 1px), #000 calc(100% / 20 - 1px), #000 calc(100% / 20 + 1px), transparent calc(100% / 20 + 1px), transparent calc(100% / 10));
            background-size: 100% 100%;
            background-position: 0 0;
            padding: 0;
        }

        /* 每一个格子（用于点击交互） */
        .cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2;
        }

        /* ==================== 像素风棋子 ==================== */
        .piece {
            position: absolute;
            width: 82%;
            height: 82%;
            background: #ffebc2;
            border: 4px solid #000;
            /* 3D 像素阴影 */
            box-shadow: 
                4px 4px 0 #000,
                inset -4px -4px 0 rgba(0,0,0,0.2),
                inset 4px 4px 0 rgba(255,255,255,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: clamp(16px, 4vw, 28px);
            z-index: 10;
            /* 关键点：穿透点击事件，让底层的 cell 接收点击 */
            pointer-events: none; 
        }
        .piece.red { color: #d32f2f; }
        .piece.black { color: #000; }

        /* ==================== 高亮状态 ==================== */
        /* 选中己方棋子 */
        .cell.selected::before {
            content: '';
            position: absolute;
            inset: 2px;
            background: rgba(255, 255, 0, 0.4);
            border: 3px dashed #ff0000;
            z-index: 5;
        }
        /* 可移动空位（绿色闪烁） */
        .cell.move::before {
            content: '';
            position: absolute;
            inset: 25%;
            background: #00ff00;
            border: 2px solid #000;
            box-shadow: 2px 2px 0 #000;
            z-index: 5;
            animation: blink 1s infinite alternate;
        }
        /* 可吃子位置（白色闪烁） */
        .cell.capture::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.6);
            border: 4px solid #fff;
            z-index: 5;
            animation: blink 1s infinite alternate;
        }
        /* 预定落子位置（粉色） */
        .cell.preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 0, 255, 0.4);
            border: 4px dashed #ff00ff;
            z-index: 6;
        }

        @keyframes blink {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* ==================== 右侧面板 ==================== */
        .panel-title {
            font-size: 1.5rem;
            color: #d4a373;
            border-bottom: 4px solid #d4a373;
            padding-bottom: 5px;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 2px 2px 0 #000;
        }
        .panel-text {
            font-size: 1.2rem;
            line-height: 1.4;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
        }
        .btn {
            background: #d4a373;
            color: #000;
            border: 4px solid #000;
            padding: 12px;
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            text-transform: uppercase;
            width: 100%;
            margin-top: 10px;
        }
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        @media (max-width: 600px) {
            #panel { width: 40vw; padding: 10px 5px; }
            .panel-title { font-size: 1.2rem; }
            .panel-text { font-size: 1rem; }
            .btn { font-size: 1.1rem; padding: 8px; }
        }
    </style>
</head>
<body>

    <!-- 左侧棋盘 -->
    <div id="board-container">
        <div id="board"></div>
    </div>

    <!-- 右侧控制面板 -->
    <div id="panel"></div>

    <script>
        // ==================== 数据与常量 ====================
        // 棋子中文名称映射表
        const PIECE_NAMES = {
            'r_c': '车', 'r_m': '马', 'r_x': '相', 'r_s': '仕', 'r_j': '帅', 'r_p': '炮', 'r_z': '兵',
            'b_c': '车', 'b_m': '马', 'b_x': '象', 'b_s': '士', 'b_j': '将', 'b_p': '炮', 'b_z': '卒'
        };

        // 初始棋盘布局 (10行 x 9列) 0为黑方底线，9为红方底线
        const INITIAL_BOARD = [
            ['b_c', 'b_m', 'b_x', 'b_s', 'b_j', 'b_s', 'b_x', 'b_m', 'b_c'],
            [null, null, null, null, null, null, null, null, null],
            [null, 'b_p', null, null, null, null, null, 'b_p', null],
            ['b_z', null, 'b_z', null, 'b_z', null, 'b_z', null, 'b_z'],
            [null, null, null, null, null, null, null, null, null],
            [null, null, null, null, null, null, null, null, null],
            ['r_z', null, 'r_z', null, 'r_z', null, 'r_z', null, 'r_z'],
            [null, 'r_p', null, null, null, null, null, 'r_p', null],
            [null, null, null, null, null, null, null, null, null],
            ['r_c', 'r_m', 'r_x', 'r_s', 'r_j', 'r_s', 'r_x', 'r_m', 'r_c']
        ];

        // 游戏全局状态对象
        let state = {
            board: [],           // 二维数组，存储棋盘棋子信息
            turn: 'r',           // 当前回合: 'r' 红方, 'b' 黑方
            selected: null,      // 选中的己方棋子: { x, y, piece }
            validMoves: [],      // 当前选中棋子的合法走法列表: [{ x, y, isCapture }]
            preview: null,       // 用户点击预定落子的目标位置: { x, y }
            targetInfo: null,    // 用户点击查看的敌方棋子信息: { x, y, piece }
            isGameOver: false    // 游戏是否结束
        };

        const boardEl = document.getElementById('board');
        const panelEl = document.getElementById('panel');

        // ==================== 调试日志工具 ====================
        /**
         * 打印当前状态到控制台，便于分析
         * @param {string} action - 触发动作的名称
         * @param {object} extra - 额外需要打印的信息
         */
        function logState(action, extra = {}) {
            console.groupCollapsed(`%c[象棋状态] ${action}`, 'color: #00ff00; font-weight: bold; font-size: 14px;');
            console.log(`当前回合: ${state.turn === 'r' ? '红方 (Red)' : '黑方 (Black)'}`);
            console.log(`选中棋子:`, state.selected ? `(${state.selected.x}, ${state.selected.y}) ${PIECE_NAMES[state.selected.piece]}` : '无');
            console.log(`合法走法数量:`, state.validMoves.length);
            if (state.validMoves.length > 0) {
                console.log(`合法走法坐标:`, state.validMoves.map(m => `(${m.x},${m.y})${m.isCapture ? '[吃]' : ''}`).join(' '));
            }
            console.log(`预定落子:`, state.preview ? `(${state.preview.x}, ${state.preview.y})` : '无');
            console.log(`查看敌方:`, state.targetInfo ? `(${state.targetInfo.x}, ${state.targetInfo.y}) ${PIECE_NAMES[state.targetInfo.piece]}` : '无');
            console.log(`游戏结束:`, state.isGameOver);
            
            if (Object.keys(extra).length > 0) {
                console.log('附加信息:', extra);
            }

            // 打印格式化棋盘快照
            let boardStr = '\n  ' + Array.from({length: 9}, (_, i) => i).join('  ') + '\n';
            for (let y = 0; y < 10; y++) {
                boardStr += y + ' ';
                for (let x = 0; x < 9; x++) {
                    const p = state.board[y][x];
                    boardStr += (p ? PIECE_NAMES[p] : '＋') + ' ';
                }
                boardStr += '\n';
            }
            console.log(boardStr);
            console.groupEnd();
        }

        // ==================== 初始化与渲染 ====================
        
        // 深拷贝初始化棋盘，防止修改初始常量
        function initBoard() {
            state.board = JSON.parse(JSON.stringify(INITIAL_BOARD));
        }

        // 渲染棋盘UI
        function renderBoard() {
            boardEl.innerHTML = '';
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 9; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    // --- 状态高亮渲染 ---
                    // 选中状态
                    if (state.selected && state.selected.x === x && state.selected.y === y) {
                        cell.classList.add('selected');
                    }
                    // 预定落子状态
                    if (state.preview && state.preview.x === x && state.preview.y === y) {
                        cell.classList.add('preview');
                    }
                    // 合法走法状态（吃子/移动）
                    const move = state.validMoves.find(m => m.x === x && m.y === y);
                    if (move) {
                        cell.classList.add(move.isCapture ? 'capture' : 'move');
                    }

                    // --- 放置棋子 ---
                    const piece = state.board[y][x];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `piece ${piece[0] === 'r' ? 'red' : 'black'}`;
                        pieceEl.innerText = PIECE_NAMES[piece];
                        cell.appendChild(pieceEl);
                    }

                    // --- 绑定点击事件 ---
                    cell.addEventListener('click', () => handleCellClick(x, y));
                    boardEl.appendChild(cell);
                }
            }
        }

        // 渲染右侧控制面板
        function renderPanel() {
            panelEl.innerHTML = '';

            // 1. 游戏结束状态
            if (state.isGameOver) {
                panelEl.innerHTML = `<div class="panel-title">GAME OVER</div><div class="panel-text" style="text-align:center; color:#00ff00; font-size:1.5rem;">${state.turn === 'r' ? '黑方胜' : '红方胜'}</div>`;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = '重新开始';
                btn.onclick = resetGame;
                panelEl.appendChild(btn);
                return;
            }

            const turnText = state.turn === 'r' ? '红方回合' : '黑方回合';
            const turnColor = state.turn === 'r' ? '#d32f2f' : '#fff';

            // 2. 已选中棋子，等待选择目标
            if (state.selected && !state.preview) {
                const pieceName = PIECE_NAMES[state.selected.piece];
                panelEl.innerHTML = `
                    <div class="panel-title">已选中</div>
                    <div class="panel-text">棋子: <span style="color:${turnColor}">${pieceName}</span></div>
                    <div class="panel-text">坐标: (${state.selected.x}, ${state.selected.y})</div>
                    <div class="panel-text" style="color:#00ff00; margin-top:10px;">请点击高亮位置</div>
                `;
            } 
            // 3. 已选中棋子，且已点击目标，等待确认
            else if (state.selected && state.preview) {
                const pieceName = PIECE_NAMES[state.selected.piece];
                panelEl.innerHTML = `
                    <div class="panel-title">预定落子</div>
                    <div class="panel-text">棋子: ${pieceName}</div>
                    <div class="panel-text">目标: (${state.preview.x}, ${state.preview.y})</div>
                `;
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = '确认落子';
                btn.onclick = confirmMove;
                panelEl.appendChild(btn);
            } 
            // 4. 点击了敌方棋子，查看信息
            else if (state.targetInfo) {
                const pieceName = PIECE_NAMES[state.targetInfo.piece];
                panelEl.innerHTML = `
                    <div class="panel-title">敌方棋子</div>
                    <div class="panel-text">棋子: <span style="color:#fff">${pieceName}</span></div>
                    <div class="panel-text">坐标: (${state.targetInfo.x}, ${state.targetInfo.y})</div>
                `;
            } 
            // 5. 默认菜单状态
            else {
                panelEl.innerHTML = `
                    <div class="panel-title">中国象棋</div>
                    <div class="panel-text" style="text-align:center; margin-top:15px; font-size:1.4rem;">
                        当前: <strong style="color:${turnColor}">${turnText}</strong>
                    </div>
                    <div class="panel-text" style="margin-top:20px; font-size:1.1rem;">
                        > 点击己方棋子选择<br><br>
                        > 绿块: 可移动空位<br><br>
                        > 白框: 可吃子位置
                    </div>
                `;
            }
        }

        // ==================== 交互逻辑 ====================
        function handleCellClick(x, y) {
            if (state.isGameOver) return;

            const piece = state.board[y][x];
            const isOwnPiece = piece && piece[0] === state.turn;
            const isEnemyPiece = piece && piece[0] !== state.turn;
            let actionLog = '';

            if (state.selected && state.selected.x === x && state.selected.y === y) {
                // 1. 取消选择
                actionLog = '取消选择';
                state.selected = null;
                state.validMoves = [];
                state.preview = null;
                state.targetInfo = null;
            } 
            else if (state.selected && state.validMoves.some(m => m.x === x && m.y === y)) {
                // 2. 预定落子 (点击了绿色或白色的高亮格子)
                actionLog = '预定落子';
                state.preview = { x, y };
                state.targetInfo = null;
            } 
            else if (isOwnPiece) {
                // 3. 切换选中己方棋子
                actionLog = '选中己方棋子';
                state.selected = { x, y, piece };
                state.validMoves = getValidMoves(x, y, piece);
                state.preview = null;
                state.targetInfo = null;
            } 
            else if (isEnemyPiece) {
                // 4. 查看敌方属性 (不会覆盖已选中的己方棋子状态)
                actionLog = '查看敌方棋子';
                state.targetInfo = { x, y, piece };
            } 
            else {
                // 5. 点空白处清空
                actionLog = '点击空白处清空状态';
                state.selected = null;
                state.validMoves = [];
                state.preview = null;
                state.targetInfo = null;
            }

            // 打印日志
            logState(actionLog, { 点击坐标: `(${x}, ${y})`, 点击的棋子: piece ? PIECE_NAMES[piece] : '空地' });

            renderBoard();
            renderPanel();
        }

        function confirmMove() {
            if (!state.selected || !state.preview) return;

            const { x: sx, y: sy } = state.selected;
            const { x: dx, y: dy } = state.preview;
            const piece = state.board[sy][sx];
            const targetPiece = state.board[dy][dx];

            // 二次校验走法合法性（安全机制）
            const moveIsValid = piece
                && piece[0] === state.turn
                && state.validMoves.some(move => move.x === dx && move.y === dy);
                
            if (!moveIsValid) {
                console.warn('非法移动被拦截!');
                state.preview = null;
                state.targetInfo = null;
                renderBoard();
                renderPanel();
                return;
            }
            
            // 执行移动
            state.board[dy][dx] = state.board[sy][sx];
            state.board[sy][sx] = null;

            // 打印日志
            logState('确认落子', { 
                移动棋子: PIECE_NAMES[piece], 
                从: `(${sx}, ${sy})`, 
                到: `(${dx}, ${dy})`,
                是否吃子: targetPiece ? `吃掉 ${PIECE_NAMES[targetPiece]}` : '否'
            });

            // 回合切换
            state.turn = state.turn === 'r' ? 'b' : 'r';
            state.selected = null;
            state.validMoves = [];
            state.preview = null;
            state.targetInfo = null;

            // 检查游戏是否结束
            checkGameOver();
            
            renderBoard();
            renderPanel();
        }

        function resetGame() {
            initBoard();
            state.turn = 'r';
            state.selected = null;
            state.validMoves = [];
            state.preview = null;
            state.targetInfo = null;
            state.isGameOver = false;
            
            logState('重置游戏');
            renderBoard();
            renderPanel();
        }

        // ==================== 规则引擎 (走法生成) ====================

        /**
         * 获取指定棋子的所有合法走法
         * @param {number} x - 棋子当前 X 坐标
         * @param {number} y - 棋子当前 Y 坐标
         * @param {string} piece - 棋子标识 (如 'r_c')
         * @param {boolean} checkSelfCheck - 是否检查走法会导致己方被将军 (默认 true)
         * @returns {Array} 合法走法列表
         */
        function getValidMoves(x, y, piece, checkSelfCheck = true) {
            const color = piece[0]; // 颜色 'r' 或 'b'
            const type = piece[2];  // 类型 'c', 'm', 'x' 等，棋子编码格式为 r_c / b_c
            let moves = [];

            // 辅助判断函数
            const isEnemy = (tx, ty) => state.board[ty][tx] && state.board[ty][tx][0] !== color;
            const isEmpty = (tx, ty) => !state.board[ty][tx];
            const isValidPos = (tx, ty) => tx >= 0 && tx < 9 && ty >= 0 && ty < 10;

            // 添加走法（自动判断是吃子还是移动）
            const addMove = (tx, ty) => {
                if (!isValidPos(tx, ty)) return;
                if (isEmpty(tx, ty)) moves.push({ x: tx, y: ty, isCapture: false });
                else if (isEnemy(tx, ty)) moves.push({ x: tx, y: ty, isCapture: true });
            };

            // 1. 车 (直线移动)
            if (type === 'c') {
                [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([dx, dy]) => {
                    let tx = x + dx, ty = y + dy;
                    while (isValidPos(tx, ty)) {
                        if (isEmpty(tx, ty)) moves.push({ x: tx, y: ty, isCapture: false });
                        else {
                            if (isEnemy(tx, ty)) moves.push({ x: tx, y: ty, isCapture: true });
                            break; // 遇到棋子阻挡则停止
                        }
                        tx += dx; ty += dy;
                    }
                });
            }

            // 2. 马 (日字，需防蹩马腿)
            if (type === 'm') {
                [
                    { dx: -1, dy: -2, bx: 0, by: -1 }, { dx: 1, dy: -2, bx: 0, by: -1 },
                    { dx: -1, dy: 2, bx: 0, by: 1 },  { dx: 1, dy: 2, bx: 0, by: 1 },
                    { dx: -2, dy: -1, bx: -1, by: 0 }, { dx: -2, dy: 1, bx: -1, by: 0 },
                    { dx: 2, dy: -1, bx: 1, by: 0 },  { dx: 2, dy: 1, bx: 1, by: 0 }
                ].forEach(m => {
                    // 检查马腿位置是否为空
                    if (isValidPos(x + m.bx, y + m.by) && isEmpty(x + m.bx, y + m.by)) {
                        addMove(x + m.dx, y + m.dy);
                    }
                });
            }

            // 3. 炮 (移动同车，吃子需隔一个棋子)
            if (type === 'p') {
                [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([dx, dy]) => {
                    let tx = x + dx, ty = y + dy;
                    let jumped = false; // 是否已经越过炮架
                    while (isValidPos(tx, ty)) {
                        if (!jumped) {
                            if (isEmpty(tx, ty)) moves.push({ x: tx, y: ty, isCapture: false });
                            else jumped = true; // 碰到第一个棋子，变成炮架
                        } else {
                            if (!isEmpty(tx, ty)) {
                                if (isEnemy(tx, ty)) moves.push({ x: tx, y: ty, isCapture: true });
                                break; // 碰到第二个棋子，判断结束
                            }
                        }
                        tx += dx; ty += dy;
                    }
                });
            }

            // 4. 相/象 (田字，需防塞象眼，不能过河)
            if (type === 'x') {
                [[-2, -2, -1, -1], [2, -2, 1, -1], [-2, 2, -1, 1], [2, 2, 1, 1]].forEach(([dx, dy, bx, by]) => {
                    const nx = x + dx, ny = y + dy;
                    // 不能过河
                    if (color === 'r' && ny < 5) return;
                    if (color === 'b' && ny > 4) return;
                    // 检查象眼是否为空
                    if (isValidPos(nx, ny) && isEmpty(x + bx, y + by)) addMove(nx, ny);
                });
            }

            // 5. 仕/士 (斜线，限制在九宫格内)
            if (type === 's') {
                [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([dx, dy]) => {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 3 && nx <= 5) {
                        if (color === 'r' && ny >= 7 && ny <= 9) addMove(nx, ny);
                        if (color === 'b' && ny >= 0 && ny <= 2) addMove(nx, ny);
                    }
                });
            }

            // 6. 帅/将 (直线，限制在九宫格内，支持飞将)
            if (type === 'j') {
                // 九宫格内移动
                [[0, 1], [0, -1], [1, 0], [-1, 0]].forEach(([dx, dy]) => {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 3 && nx <= 5) {
                        if (color === 'r' && ny >= 7 && ny <= 9) addMove(nx, ny);
                        if (color === 'b' && ny >= 0 && ny <= 2) addMove(nx, ny);
                    }
                });
                // 飞将：同一直线上且中间无棋子
                for (let ty = 0; ty < 10; ty++) {
                    if (state.board[ty][x] && state.board[ty][x][2] === 'j' && state.board[ty][x][0] !== color) {
                        let blocked = false;
                        const startY = Math.min(y, ty) + 1;
                        const endY = Math.max(y, ty);
                        for (let i = startY; i < endY; i++) {
                            if (state.board[i][x]) { blocked = true; break; }
                        }
                        if (!blocked) moves.push({ x: x, y: ty, isCapture: true });
                        break;
                    }
                }
            }

            // 7. 兵/卒 (只能向前，过河后可左右)
            if (type === 'z') {
                if (color === 'r') { // 红兵向上(y减小)
                    addMove(x, y - 1);
                    if (y <= 4) { addMove(x - 1, y); addMove(x + 1, y); } // 过河
                } else { // 黑卒向下(y增大)
                    addMove(x, y + 1);
                    if (y >= 5) { addMove(x - 1, y); addMove(x + 1, y); } // 过河
                }
            }
            return moves;
        }

        /**
         * 检查将帅是否被吃，或当前回合方是否无子可动
         */
        function checkGameOver() {
            const kings = { r: false, b: false };
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 9; x++) {
                    const piece = state.board[y][x];
                    if (piece && piece[2] === 'j') {
                        kings[piece[0]] = true;
                    }
                }
            }

            if (!kings.r || !kings.b) {
                state.isGameOver = true;
                const winner = kings.r ? '红方' : '黑方';
                console.log(`%c[游戏结束] ${!kings.r ? '红方帅' : '黑方将'}被吃，${winner}获胜！`, 'color: red; font-size: 16px; font-weight: bold;');
                return;
            }

            let hasValidMove = false;
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 9; x++) {
                    const piece = state.board[y][x];
                    if (piece && piece[0] === state.turn) {
                        if (getValidMoves(x, y, piece).length > 0) {
                            hasValidMove = true;
                            break;
                        }
                    }
                }
                if (hasValidMove) break;
            }
            if (!hasValidMove) {
                state.isGameOver = true;
                console.log(`%c[游戏结束] ${state.turn === 'r' ? '红方' : '黑方'}无子可动，${state.turn === 'r' ? '黑方' : '红方'}获胜！`, 'color: red; font-size: 16px; font-weight: bold;');
            }
        }

        // ==================== 启动 ====================
        initBoard();
        logState('游戏初始化');
        renderBoard();
        renderPanel();
    </script>
